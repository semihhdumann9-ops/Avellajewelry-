<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avella Jewelry — Zerafetin şık dokunuşu...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Great+Vibes&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --espresso: #2c1810;
      --espresso-deep: #1e0f09;
      --espresso-soft: #43271c;
      --cream: #f7f2ea;
      --cream-card: #fdfbf7;
      --sand: #ece3d5;
      --gold: #d9be8c;
      --gold-bright: #ebd4a7;
      --ink: #24150e;
      --muted: #6e594d;
      --border: rgba(44, 24, 16, 0.13);
      --shadow: 0 18px 45px rgba(30, 15, 9, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--cream);
      color: var(--ink);
      line-height: 1.6;
      overflow-x: hidden;
    }

    body.gate-locked {
      overflow: hidden;
    }

    body.gate-locked #storefront-shell {
      display: none !important;
    }

    /* ==================== TAM EKRAN AÇILIŞ KAPISI ==================== */
    #intro-gate {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background:
        radial-gradient(circle at 50% 42%, rgba(217, 190, 140, 0.11), transparent 58%),
        linear-gradient(165deg, #2f1910 0%, #21110a 58%, #170b06 100%);
      color: var(--gold-bright);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 20px;
      text-align: center;
      transition: opacity 0.65s cubic-bezier(0.22, 1, 0.36, 1), transform 0.65s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.65s;
    }

    #intro-gate.gate-leaving {
      opacity: 0;
      transform: scale(1.03);
      visibility: hidden;
      pointer-events: none;
    }

    .gate-inner {
      max-width: 560px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      animation: gateFadeUp 0.95s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes gateFadeUp {
      from {
        opacity: 0;
        transform: translateY(22px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes starPulse {
      0%, 100% {
        transform: scale(1) rotate(0deg);
        opacity: 0.92;
      }
      50% {
        transform: scale(1.14) rotate(8deg);
        opacity: 1;
      }
    }

    .brand-mark {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
    }

    .brand-mark-main {
      position: relative;
      display: inline-flex;
      align-items: flex-end;
      line-height: 1;
    }

    .brand-avella {
      font-family: 'Alex Brush', 'Great Vibes', cursive;
      font-size: clamp(4.6rem, 15vw, 7.2rem);
      font-weight: 400;
      letter-spacing: 0.01em;
      color: var(--gold-bright);
      line-height: 0.88;
      text-shadow: 0 6px 24px rgba(0, 0, 0, 0.35);
    }

    .brand-sparkle {
      position: relative;
      top: -42px;
      margin-left: -4px;
      width: 30px;
      height: 30px;
      flex-shrink: 0;
      animation: starPulse 3.4s ease-in-out infinite;
    }

    .brand-jewelry {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-weight: 500;
      font-size: clamp(1.3rem, 3.8vw, 1.8rem);
      letter-spacing: 0.06em;
      color: var(--gold);
      margin-top: -6px;
      margin-left: 72px;
    }

    .gate-tagline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: clamp(1.25rem, 3.6vw, 1.6rem);
      color: rgba(235, 212, 167, 0.9);
      margin-top: 22px;
      letter-spacing: 0.02em;
    }

    .gate-btn {
      margin-top: 34px;
      background: var(--gold-bright);
      color: var(--espresso-deep);
      border: 1px solid rgba(235, 212, 167, 0.55);
      padding: 15px 38px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
      transition: transform 0.25s ease, background-color 0.25s ease, box-shadow 0.25s ease;
    }

    .gate-btn:hover {
      background: #fff2d6;
      transform: translateY(-2px);
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    .gate-btn:active {
      transform: translateY(0);
    }

    /* ==================== ANA VİTRİN ==================== */
    #storefront-shell {
      animation: pageReveal 0.7s ease both;
    }

    @keyframes pageReveal {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .announcement-bar {
      background: var(--espresso);
      color: var(--gold-bright);
      text-align: center;
      padding: 9px 16px;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-weight: 500;
    }

    header.site-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(247, 242, 234, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .header-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 20px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
    }

    .header-left,
    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .header-right {
      justify-content: flex-end;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--espresso);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 10px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 500;
      text-decoration: none;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .icon-btn:hover {
      background: var(--sand);
      border-color: var(--border);
    }

    .header-brand .brand-avella {
      font-size: 2.45rem;
      color: var(--espresso);
      text-shadow: none;
      line-height: 0.85;
    }

    .header-brand .brand-sparkle {
      top: -14px;
      margin-left: -2px;
      width: 13px;
      height: 13px;
      animation: none;
    }

    .header-brand .brand-jewelry {
      font-size: 0.78rem;
      color: var(--espresso-soft);
      margin-top: -2px;
      margin-left: 24px;
    }

    .cart-badge {
      background: var(--espresso);
      color: var(--gold-bright);
      font-size: 0.7rem;
      font-weight: 600;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
    }

    /* Drawer Menü */
    .nav-drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(23, 11, 6, 0.52);
      z-index: 400;
      display: none;
      justify-content: flex-start;
    }

    .nav-drawer-backdrop.open {
      display: flex;
    }

    .nav-drawer {
      width: min(320px, 84vw);
      height: 100%;
      background: var(--cream);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: var(--shadow);
    }

    .nav-drawer a,
    .nav-drawer button.drawer-link {
      color: var(--espresso);
      text-decoration: none;
      background: none;
      border: none;
      text-align: left;
      font-size: 1rem;
      font-weight: 500;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      font-family: inherit;
    }

    /* Hero */
    .hero {
      max-width: 820px;
      margin: 0 auto;
      padding: 28px 20px 36px;
      text-align: center;
    }

    .hero-frame {
      border-radius: 18px;
      overflow: hidden;
      background: var(--sand);
      box-shadow: var(--shadow);
      aspect-ratio: 4 / 3;
      max-height: 460px;
      margin: 0 auto 24px;
      position: relative;
    }

    .hero-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .hero-kicker {
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2.2rem, 5.5vw, 3.35rem);
      font-weight: 500;
      line-height: 1.12;
      color: var(--espresso);
      margin-bottom: 12px;
    }

    .hero p {
      max-width: 520px;
      margin: 0 auto 22px;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .btn-primary {
      background: var(--espresso);
      color: var(--gold-bright);
      border: none;
      padding: 13px 28px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    .btn-primary:hover {
      background: var(--espresso-soft);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: transparent;
      color: var(--espresso);
      border: 1px solid rgba(44, 24, 16, 0.28);
      padding: 11px 22px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .btn-secondary:hover {
      background: var(--sand);
    }

    section.section-block {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 20px;
    }

    .section-head {
      text-align: center;
      margin-bottom: 26px;
    }

    .section-head h2 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
      font-weight: 500;
      color: var(--espresso);
    }

    .section-head p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    /* Kategoriler */
    .category-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      max-width: 820px;
      margin: 0 auto;
    }

    .category-card {
      background: var(--cream-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      text-align: center;
      transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    .category-card:hover,
    .category-card.active {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
      border-color: var(--espresso);
    }

    .category-card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      display: block;
    }

    .category-card .cat-title {
      padding: 12px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--espresso);
    }

    /* Ürünler */
    .filter-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .filter-chip {
      background: var(--cream-card);
      border: 1px solid var(--border);
      color: var(--espresso);
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .filter-chip.active,
    .filter-chip:hover {
      background: var(--espresso);
      color: var(--gold-bright);
      border-color: var(--espresso);
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: var(--cream-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow);
    }

    .product-img-wrap {
      aspect-ratio: 1 / 1;
      background: var(--sand);
      overflow: hidden;
      position: relative;
    }

    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .product-body {
      padding: 15px 16px 17px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .product-cat {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      font-weight: 600;
    }

    .product-name {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.32rem;
      font-weight: 600;
      color: var(--espresso);
      line-height: 1.2;
    }

    .product-desc {
      font-size: 0.82rem;
      color: var(--muted);
      flex: 1;
    }

    .product-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 6px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .product-price {
      font-weight: 600;
      font-size: 0.98rem;
      color: var(--espresso);
    }

    .add-cart-btn {
      background: var(--espresso);
      color: var(--gold-bright);
      border: none;
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 0.74rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    .add-cart-btn:hover {
      background: var(--espresso-soft);
    }

    /* Koyu Koleksiyon Bandı */
    .collection-banner {
      background: linear-gradient(155deg, var(--espresso) 0%, var(--espresso-deep) 100%);
      color: var(--cream);
      padding: 46px 20px;
      text-align: center;
      margin: 18px 0;
    }

    .collection-banner .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .collection-banner h2 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(2rem, 4.5vw, 2.8rem);
      font-weight: 500;
      color: var(--gold-bright);
      margin-bottom: 8px;
    }

    .collection-banner p {
      color: rgba(247, 242, 234, 0.82);
      font-size: 0.92rem;
      max-width: 520px;
      margin: 0 auto;
    }

    /* Güven Rozetleri */
    .trust-strip {
      max-width: 900px;
      margin: 0 auto;
      padding: 36px 20px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      text-align: center;
    }

    .trust-item {
      background: var(--cream-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px 12px;
    }

    .trust-icon {
      font-size: 1.35rem;
      margin-bottom: 6px;
      color: var(--espresso);
    }

    .trust-label {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--espresso);
    }

    /* Sizden Gelenler & Instagram */
    .reviews-box {
      max-width: 680px;
      margin: 0 auto;
      background: var(--cream-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .reviews-box img {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
    }

    .reviews-caption {
      padding: 18px 20px;
      text-align: center;
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.3rem;
      color: var(--espresso);
    }

    .ig-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      max-width: 780px;
      margin: 0 auto 22px;
    }

    .ig-card {
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--sand);
    }

    .ig-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .ig-handle-link {
      display: block;
      text-align: center;
      font-weight: 600;
      color: var(--espresso);
      text-decoration: none;
      font-size: 1rem;
      letter-spacing: 0.04em;
    }

    .ig-handle-link:hover {
      text-decoration: underline;
    }

    /* Footer */
    footer.site-footer {
      background: linear-gradient(165deg, var(--espresso) 0%, var(--espresso-deep) 100%);
      color: var(--cream);
      padding: 48px 20px 36px;
      text-align: center;
      margin-top: 28px;
    }

    footer .brand-avella {
      font-size: 3.4rem;
      color: var(--gold-bright);
    }

    footer .brand-sparkle {
      top: -22px;
      width: 18px;
      height: 18px;
      animation: none;
    }

    footer .brand-jewelry {
      font-size: 1rem;
      color: var(--gold);
      margin-left: 40px;
    }

    .footer-tagline {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-style: italic;
      font-size: 1.2rem;
      color: rgba(235, 212, 167, 0.88);
      margin-top: 12px;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 18px;
      margin: 24px 0 18px;
      font-size: 0.84rem;
    }

    .footer-links a,
    .footer-links button {
      color: rgba(247, 242, 234, 0.86);
      text-decoration: none;
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      font-size: 0.84rem;
    }

    .footer-links a:hover,
    .footer-links button:hover {
      color: var(--gold-bright);
      text-decoration: underline;
    }

    .footer-copy {
      font-size: 0.74rem;
      color: rgba(247, 242, 234, 0.55);
    }

    /* ==================== SEPET ÇEKMECESİ ==================== */
    .cart-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(23, 11, 6, 0.56);
      z-index: 500;
      display: none;
      justify-content: flex-end;
    }

    .cart-backdrop.open {
      display: flex;
    }

    .cart-drawer {
      width: min(410px, 100vw);
      height: 100%;
      background: var(--cream);
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
    }

    .cart-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .cart-header h3 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.55rem;
      color: var(--espresso);
    }

    .close-btn {
      background: transparent;
      border: 1px solid var(--border);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 1.1rem;
      color: var(--espresso);
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cart-item {
      background: var(--cream-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .cart-item img {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .cart-item-info {
      flex: 1;
    }

    .cart-item-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--espresso);
    }

    .cart-item-price {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .qty-controls {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .qty-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--cream);
      color: var(--espresso);
      font-weight: 600;
      cursor: pointer;
    }

    .cart-footer {
      padding: 18px 20px;
      border-top: 1px solid var(--border);
      background: var(--cream-card);
    }

    .customer-note-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--cream);
      font-family: inherit;
